<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SkyCast</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

    <main class="container">

        <header>

            <h1>🌤 SkyCast</h1>

            <p>Your simple weather companion.</p>

        </header>

        <section class="search-card">

            <input
                id="city"
                type="text"
                placeholder="Search for a city..."
                autocomplete="off"
            >

            <button id="search-button">
                Search
            </button>

        </section>

        <section id="favorites-container">

            <!-- Favorite cities will appear here -->

        </section>

        <section id="result">

            <section id="weather-container">

                <div class="welcome-card">

                    <h2>Welcome!</h2>

                    <p>
                        Enter a city above to see the latest weather.
                    </p>

                </div>

            </section>

            <section id="forecast-container">

            </section>

        </section>

    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/weather.js"></script>
    <script src="/static/js/forecast.js"></script>

    <!-- Favorites module (coming next) -->
    <script src="/static/js/favorites.js"></script>

    <script src="/static/script.js"></script>

</body>
</html>
